<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ride route</title>
    <link rel="stylesheet" href="maplibre/maplibre-gl.css">
    <style>
        html, body, #map {
            height: 100%;
            width: 100%;
            margin: 0;
            padding: 0;
            background: #0E1218;
        }

        body {
            overflow: hidden;
        }

        .maplibregl-ctrl-attrib {
            background: rgba(14, 18, 24, 0.78) !important;
            color: #9AA4B2 !important;
            font: 10px/1.4 Roboto, -apple-system, sans-serif;
            border-radius: 6px;
        }

        .maplibregl-ctrl-attrib a {
            color: #8FB4FF !important;
        }

        /* Keep the attribution clear of the native summary card. */
        .maplibregl-ctrl-bottom-right {
            bottom: 92px;
        }

        .pin {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font: 700 12px/1 Roboto, sans-serif;
            color: #fff;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.55);
            box-sizing: border-box;
        }

        .pin.start {
            background: #34D399;
        }

        .pin.finish {
            background: #F87171;
        }
    </style>
</head>
<body>
<div id="map"></div>
<script src="maplibre/maplibre-gl.js"></script>
<script>
    (function () {
        'use strict';

        function notify(method, value) {
            try {
                if (window.XsrMap && typeof window.XsrMap[method] === 'function') {
                    window.XsrMap[method](value);
                }
            } catch (ignored) {
                // Bridge is Android-only; ignore failures in a plain browser.
            }
        }

        window.onerror = function (message, source, line) {
            notify('onError', message + ' @ ' + source + ':' + line);
            return false;
        };

        // OpenFreeMap: free vector tiles, no API key, no registration.
        var map = new maplibregl.Map({
            container: 'map',
            style: 'https://tiles.openfreemap.org/styles/dark',
            center: [0, 0],
            zoom: 1,
            attributionControl: { compact: false },
            fadeDuration: 0,
            maxTileCacheSize: 64,
            refreshExpiredTiles: false,
            renderWorldCopies: true
        });

        map.dragRotate.disable();
        map.touchZoomRotate.disableRotation();

        var ready = false;
        var pending = null;
        var routeLayerIds = ['xsr-route-casing', 'xsr-route-line'];
        var markers = [];

        map.on('load', function () {
            ready = true;
            notify('onReady', 'maplibre ' + maplibregl.getVersion());
            map.once('idle', function () {
                notify('onIdle', 'sources=' + Object.keys(map.getStyle().sources).join('|'));
            });
            if (pending) {
                var args = pending;
                pending = null;
                draw(args[0], args[1], args[2]);
            }
        });

        map.on('error', function (event) {
            var message = event && event.error && event.error.message
                ? event.error.message
                : 'map error';
            notify('onTileError', message);
        });

        window.addEventListener('resize', function () {
            map.resize();
        });

        function clearRoute() {
            for (var i = 0; i < markers.length; i++) {
                markers[i].remove();
            }
            markers = [];
            for (var j = 0; j < routeLayerIds.length; j++) {
                if (map.getLayer(routeLayerIds[j])) map.removeLayer(routeLayerIds[j]);
            }
            if (map.getSource('xsr-route')) map.removeSource('xsr-route');
        }

        function pin(lngLat, cls, letter, title) {
            var el = document.createElement('div');
            el.className = 'pin ' + cls;
            el.textContent = letter;
            el.title = title;
            el.setAttribute('aria-label', title);
            return new maplibregl.Marker({ element: el, anchor: 'center' })
                .setLngLat(lngLat)
                .addTo(map);
        }

        function draw(points, startLabel, finishLabel) {
            clearRoute();
            if (!points || points.length === 0) return;

            var latlngs = points.map(function (p) { return [p[1], p[0]]; });
            var coordinates = points.map(function (p) { return [p[1], p[0]]; });

            map.addSource('xsr-route', {
                type: 'geojson',
                data: {
                    type: 'Feature',
                    properties: {},
                    geometry: { type: 'LineString', coordinates: coordinates }
                }
            });

            var firstSymbol = null;
            var layers = (map.getStyle() && map.getStyle().layers) || [];
            for (var i = 0; i < layers.length; i++) {
                if (layers[i].type === 'symbol') {
                    firstSymbol = layers[i].id;
                    break;
                }
            }

            map.addLayer({
                id: 'xsr-route-casing',
                type: 'line',
                source: 'xsr-route',
                layout: { 'line-cap': 'round', 'line-join': 'round' },
                paint: { 'line-color': '#4D8DFF', 'line-width': 10, 'line-opacity': 0.18 }
            }, firstSymbol);

            map.addLayer({
                id: 'xsr-route-line',
                type: 'line',
                source: 'xsr-route',
                layout: { 'line-cap': 'round', 'line-join': 'round' },
                paint: { 'line-color': '#4D8DFF', 'line-width': 5, 'line-opacity': 0.95 }
            }, firstSymbol);

            markers.push(pin(latlngs[0], 'start', 'S', startLabel));
            markers.push(pin(latlngs[latlngs.length - 1], 'finish', 'F', finishLabel));

            if (latlngs.length === 1) {
                map.jumpTo({ center: latlngs[0], zoom: 16 });
            } else {
                var bounds = new maplibregl.LngLatBounds();
                for (var k = 0; k < latlngs.length; k++) bounds.extend(latlngs[k]);
                map.fitBounds(bounds, {
                    padding: { top: 72, right: 56, bottom: 120, left: 56 },
                    maxZoom: 17,
                    duration: 0
                });
            }

            notify('onRouteDrawn', latlngs.length);
        }

        /**
         * Called from the Android host once the ride points are loaded.
         * points: [[lat, lng], ...]
         */
        window.showRoute = function (points, startLabel, finishLabel) {
            if (!ready) {
                pending = [points, startLabel, finishLabel];
                return;
            }
            draw(points, startLabel, finishLabel);
        };
    })();
</script>
</body>
</html>
